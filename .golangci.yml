version: "2"

run:
  concurrency: 4
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  go: "1.21"

output:
  formats:
    colored-line-number: true
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - whitespace
  disable:
    - depguard
    - misspell
    - prealloc

linters-settings:
  gocyclo:
    min-complexity: 15
  depguard:
    rules:
      main:
        files:
          - $all
          - "!$test"
        allow:
          - $gostd  # Allow all Go standard library packages
          - github.com/dgaldamez77/befound
          - github.com/dgaldamez77/befound/**
          - github.com/dgaldamez77/eventmanager
          - github.com/dgaldamez77/eventmanager/**
          - github.com/joomcode/errorx/**
          - github.com/lib/pq/**
          - github.com/patrickmn/go-cache/**
          - github.com/spf13/viper/**
          - github.com/swaggo/swag/**
        deny:
          - pkg: log
            desc: Use company logger instead
          - pkg: math/rand
            desc: Use crypto/rand for security-sensitive operations
      test:
        files:
          - "$test"
        allow:
          - $gostd
          - github.com/dgaldamez77/befound
          - github.com/dgaldamez77/befound/**
          - github.com/dgaldamez77/eventmanager
          - github.com/dgaldamez77/eventmanager/**
          - github.com/joomcode/errorx/**
          - github.com/lib/pq/**
          - github.com/patrickmn/go-cache/**
          - github.com/spf13/viper/**
          - github.com/swaggo/swag/**
          - github.com/stretchr/testify/**
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - "hugeParam"
  goconst:
    ignore-string-values: []
    find-duplicates: true
    eval-const-expressions: true

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - gocyclo
        - gocritic
    - path: "internal/mocks"
      linters:
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
  severity:
    default: "error"
